/* ===== v2.06 UI step 6 part A: the game screen. The field fills the window under a short DOM banner (score, clock, PAUSE, down and distance); one big corner button on the offense's side; the PLAYS and PAUSE sheets. Atkinson Hyperlegible (latin 400 and 700, embedded above). All of it sits inside the safe areas (--pt --pr --pb --pl set by fit()). Not for menus (#app.mn) or the designer. ===== */
#app.gm{box-shadow:none;font-size:16px;background:#000;--k:.9;--kb:1;--bh:31px;--pt:0px;--pr:0px;--pb:0px;--pl:0px;--pbg:rgba(8,13,28,.93);--tx1:#fff;--lab:#a9b9e6;--y:#ffd400;--bt:#ffd400;--btx:#10142a;--bb:#1a2547;--bbx:#fff}
#app:not(.gm) :is(#gh,#bPlay,#gpl,#gpz,#lkst,#lkbtn,#pbp){display:none!important}
#app.gm #c,#app.gm #cfg,#app.gm #ctp{position:absolute;left:0;top:var(--ct,var(--bh));width:100%;height:var(--ch,calc(100% - var(--bh)))}
#cbg{display:none;pointer-events:none}#app.gm #cbg{display:block;position:absolute;left:0;width:100%}#cfg,#ctp{pointer-events:none}#cfg{image-rendering:auto}#app:not(.gm) #cfg,#app:not(.gm) #ctp{display:none}
.gh,.gh *,#bPlay,.shb,.shb *{font-family:'Atk',sans-serif;font-weight:700;letter-spacing:0}
.gh{position:absolute;left:0;right:0;top:0;height:var(--bh);display:flex;align-items:center;justify-content:space-between;gap:calc(10px*var(--k));padding:var(--pt) calc(var(--pr) + 8px) 0 calc(var(--pl) + 8px);background:var(--pbg);color:var(--tx1);font-size:calc(18px*var(--k))}
.gh.u1{box-shadow:inset 0 -3px 0 #ffb52e}.gh.u2{box-shadow:inset 0 -3px 0 #ff5a5a}
.gh .bsc{display:flex;align-items:center;gap:calc(8px*var(--k));flex:1 1 0;min-width:0}
.gh .ch{display:block;flex:none;width:calc(10px*var(--k));height:calc(22px*var(--k));border:2px solid #fff;background:#888}
.gh .ab{font-size:calc(14px*var(--k)*1.1)}
.gh .n{font-size:calc(21px*var(--k));font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;margin-right:calc(8px*var(--k))}
.gh .n.us{color:var(--y)}
.gh .bmid{display:flex;align-items:center;gap:calc(22px*var(--k));flex:none}
.gh .bck{display:flex;align-items:center;gap:calc(10px*var(--k));background:#000;padding:calc(3px*var(--k)) calc(14px*var(--k));--clk:#fff;color:var(--clk)}
.gh .bck .lab{color:var(--lab);font-size:calc(14px*var(--k))}
.gh .bck .t{font-size:calc(28px*var(--k));line-height:.9;font-variant-numeric:tabular-nums;color:var(--clk)}
.gh .dot{display:block;flex:none;width:calc(10px*var(--k));height:calc(10px*var(--k));background:#4ee08a;border-radius:50%}.gh .dot.off{background:transparent;border:3px solid var(--lab);border-radius:0}
.gh .bck.u1{--clk:#ffb52e;box-shadow:inset 0 0 0 3px #ffb52e}.gh .bck.u2{--clk:#ff5a5a;box-shadow:inset 0 0 0 3px #ff5a5a}

 const go=i=>{if(i===16)return true;const a=A[i];for(const b of shuffle(B.slice())){if(taken.has(b)||used.has(a*32+b))continue;taken.add(b);out.push([a,b]);if(go(i+1))return true;out.pop();taken.delete(b)}return false};
 return go(0)?out:null}
function lgTrySched(){
 const used=new Set(),rounds=[],key=(a,b)=>a<b?a*32+b:b*32+a;
 for(const m of[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]])for(let rep=0;rep<2;rep++){
  const r=[];for(let d=0;d<8;d++)for(const[a,b]of m)r.push([d*4+a,d*4+b]);rounds.push(r)}
 for(const r of rounds)for(const[a,b]of r)used.add(key(a,b));
 for(let k=0;k<6;k++){const r=[];for(let c=0;c<2;c++){const m=lgMatchSame(c*16,used);if(!m)return null;r.push(...m)}for(const[a,b]of r)used.add(key(a,b));rounds.push(r)}
 for(let k=0;k<5;k++){const m=lgMatchCross(used);if(!m)return null;for(const[a,b]of m)used.add(key(a,b));rounds.push(m)}
 return shuffle(rounds)}
/* v1.63 college schedule: 9 rounds of conference round-robin (circle method inside each conference of 10) + 3 rounds of
   non-conference games (the 6 conferences are paired off 3 different ways, teams matched at random inside each pairing) */
function lgSchedCol(c){
 const pc=c.per,rounds=[],cl=[];
 for(let k=0;k<c.nc;k++)cl.push(shuffle(Array.from({length:pc},(_,i)=>k*pc+i)));
 for(let r=0;r<pc-1;r++){const rd=[];
  for(let k=0;k<c.nc;k++){const a=cl[k];for(let i=0;i<pc/2;i++)rd.push([a[i],a[pc-1-i]]);cl[k]=[a[0],a[pc-1],...a.slice(1,pc-1)]}
  rounds.push(rd)}
 const co=shuffle(Array.from({length:c.nc},(_,i)=>i)),cr=[];
 for(let r=0;r<c.nc-1;r++){const rd=[];for(let i=0;i<c.nc/2;i++){const a=co[i],b=co[c.nc-1-i];rd.push([a,b])}cr.push(rd);co.splice(1,0,co.pop())}
 for(const rd of shuffle(cr).slice(0,c.games-(pc-1))){const g=[];
  for(const[a,b]of rd){const A=shuffle(Array.from({length:pc},(_,i)=>a*pc+i)),B=shuffle(Array.from({length:pc},(_,i)=>b*pc+i));for(let i=0;i<pc;i++)g.push([A[i],B[i]])}
  rounds.push(g)}

/* v1.56: in every pair of a round the first team is the home team. Each team gets 8 or 9 home games and division rivals play once at each park. */
function lgOrient(s,c){c=c||LGF.NFL;const hc=new Array(lgN(c)).fill(0),seen={},hi=Math.ceil(c.games/2),lo=Math.floor(c.games/2);
 for(const rd of s)for(const g of rd){let[a,b]=g;const k=Math.min(a,b)+'-'+Math.max(a,b);let h;
  if(seen[k]!=null)h=seen[k]===a?b:a;else h=hc[a]!==hc[b]?(hc[a]<hc[b]?a:b):(Math.random()<.5?a:b);
  seen[k]=h;hc[h]++;g[0]=h;g[1]=h===a?b:a}
 /* balance: flip single (non-division) games from a team with too many home games to an opponent with fewer */
 const cnt={};for(const rd of s)for(const[a,b]of rd){const k=Math.min(a,b)+'-'+Math.max(a,b);cnt[k]=(cnt[k]||0)+1}
 for(let it=0;it<2000;it++){let moved=false;
  for(const rd of s)for(const g of rd){const k=Math.min(g[0],g[1])+'-'+Math.max(g[0],g[1]);if(cnt[k]>1)continue;
   if(hc[g[0]]-hc[g[1]]>=2||(hc[g[0]]>=hi&&hc[g[1]]<lo&&hc[g[0]]>hc[g[1]])){hc[g[0]]--;hc[g[1]]++;g.reverse();moved=true}}
  if(!moved)break}

const lgHomeWk=w=>{const L=LG();return L.sched[w].some(g=>g[0]===L.me)};
function lgSchedule(L){const c=lgCfg(L),s=c.id==='COL'?lgSchedCol(c):lgSchedule0();return lgOrient(s,c)}
function lgSchedule0(){for(let i=0;i<80;i++){const r=lgTrySched();if(r)return r}
 /* fallback that cannot fail: plain rotation (should never be needed) */
 return Array.from({length:17},(_,r)=>Array.from({length:16},(_,i)=>[i,16+((i+r)%16)]))}
function lgOpp(w,id){for(const[a,b]of LG().sched[w]){if(a===id)return b;if(b===id)return a}return -1}
const lgKind=(a,b)=>{const L=LG(),t=L.teams,c=lgCfg(L);return t[a].conf!==t[b].conf?(c.nc>2?'NON-CONFERENCE':'INTERCONFERENCE'):c.dv>1&&t[a].div===t[b].div?'DIVISION RIVAL':'CONFERENCE'};

function lgRt(id){const L=LG(),R=S.r;if(id!==L.me)return L.teams[id];const o=RO(),q=(o.qb.arm+o.qb.acc)/2,rc=[...o.wr,o.te].reduce((a,x)=>a+x.spd+x.cat,0)/8;return{off:(q+rc+R.rb+R.ol)/4,def:R.def}}
/* v2.22: one game of the league sim = lgGameKey (which game of which week) + the engine's seeded stream. lgRecGame, lgOrder, lgDivIds, lgPct, lgCP are thin wrappers on the engine for the open league. */
const lgRecGame=(a,b,pa,pb)=>LGE.recGame(LG(),a,b,pa,pb);
const lgPct=LGE.pct,lgCP=LGE.cp;
const lgOrder=(ids,ov)=>LGE.order(LG(),ids,ov);
const lgDivIds=(c,d,cf)=>LGE.divIds(cf||LGC(),c,d);

function lgRank(id){const t=LG().teams[id],o=lgOrder(lgDivIds(t.conf,t.div)).indexOf(id)+1;return o+['TH','ST','ND','RD','TH'][o>3?0:o]}
/* record my game, simulate the other 15 of the week, move on */
function lgFinishWeek(w,mp,op){
 const L=LG(),opp=lgOpp(w,L.me);
 const games=LGE.playWeek(L,w,S.season,lgRt,[[L.me,opp,mp,op]]); /* v2.22: my result as a list of one; every other game from its own seeded stream */

/* ----- playoffs: 7 seeds per conference, seed 1 gets a bye ----- */
const lgSeedPO=()=>LGE.seedPO(LG());
const lgPoGames=()=>LGE.poGames(LG());
const lgHum=win=>[{id:LG().me,win:!!win}];   /* the one human of this game, as the engine's list */
/* play one whole round; myWin decides my game if I am in it */
const lgPoRound=myWin=>LGE.poRound(LG(),S.season,lgRt,lgHum(myWin));
const lgSimRestPo=()=>LGE.simRestPo(LG(),S.season,lgRt,lgHum(false));
function lgEndRegular(){
 const L=LG();lgSeedPO();
 if(!L.po.seeds.some(s=>s.includes(L.me))){lgSimRestPo();S.over='missed';return}
 S.phase='playoff';
 if(L.po.alive.some(x=>{const k=x.indexOf(L.me);return k>=0&&k<lgCfg(L).byes}))lgPoRound(false);          /* a bye seed: the rest of round 1 is simulated */
 S.round=L.po.round}

/* ----- hooks used by the game ----- */
function lgNextOpp(){
 const L=LG();let id;
 if(S.phase==='reg')id=lgOpp(S.week,L.me);
 else{const g=lgPoGames().find(g=>g.includes(L.me));id=g[0]===L.me?g[1]:g[0]}
 const t=L.teams[id];let home;
 if(S.phase==='reg')home=lgHomeWk(S.week);else{const g=lgPoGames().find(g=>g.includes(L.me));home=L.po.round>=lgCfg(L).homeRds?null:g[0]===L.me}

const lgLabel=()=>S.phase==='reg'?'WEEK '+(S.week+1)+' OF '+LGC().games:LGC().rnd[LG().po.round];
function lgAfterGame(win,tie,cr,mp,op){

 if(S.phase==='reg'){lgFinishWeek(S.week,mp,op);if(S.week>=LGC().games)lgEndRegular()}
 else{
  const final=L.po.round===3;lgPoRound(win);
  if(win){if(final){S.over='champ';S.champs++;cr+=4}else S.round=L.po.round}
  else{S.over='elim';lgSimRestPo()}}

/* v2.22: SIM GAME of my own game: the same seeded stream and the same pair order (first team = the pair's first team) as any other device would use for this game, so the result is the same everywhere. Returns [my score, their score]. */
function lgSimMy(po){
 const L=LG(),reg=S.phase==='reg',pairs=reg?L.sched[S.week]:lgPoGames(),gi=pairs.findIndex(g=>g[0]===L.me||g[1]===L.me),g=pairs[gi];

 let cr=win?3:tie?2:1;if(po&&win)cr+=2;

 <div style="font-size:1.4em">${S.name} ${mp} - ${op} ${o.name}</div><p style="color:#ffd400">${sc(`+${cr} COACH CREDITS EARNED`)}</p><button class="btn" id="bPostGo">CONTINUE</button>`;

/* ----- league backup: export / import codes (v1.73). Format: PPSAVE1:<g|r>:<checksum>:<base64url data>, data = JSON, gzipped when the browser can ----- */
const BK_PRE='PPSAVE1:',BK_WEEK=7*864e5,BK_DIS={};
let BK={mode:'',id:null,code:'',items:null,seq:0};
const bkHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
function bkB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUn64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
const bkCanZip=()=>typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined'&&typeof Blob!=='undefined'&&typeof Response!=='undefined';
async function bkPipe(bytes,Cls,fmt){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Cls(fmt))).arrayBuffer())}
async function bkPack(obj,raw){
 const json=JSON.stringify(obj);let bytes=new TextEncoder().encode(json),flag='r';
 if(!raw&&bkCanZip()){try{bytes=await bkPipe(bytes,CompressionStream,'gzip');flag='g'}catch(e){bytes=new TextEncoder().encode(json);flag='r'}}
 const data=bkB64(bytes);return BK_PRE+flag+':'+bkHash(data)+':'+data}
const bkBad=msg=>({ok:false,msg});
/* does the object look like one of our league saves? (teams, a season, a my-team id) */
function bkShape(d){
 if(!d||typeof d!=='object'||Array.isArray(d))return false;
 if(!(+d.season>=1))return false;
 if(d.lg){const L=d.lg;return!!(L&&Array.isArray(L.teams)&&L.teams.length>=2&&Number.isInteger(L.me)&&L.teams[L.me]&&typeof L.teams[L.me]==='object')}
 return typeof d.name==='string'&&Array.isArray(d.sched)&&!!d.r&&typeof d.r==='object'}
const bkInfo=d=>{const rec=(d.w|0)+'-'+(d.l|0)+(d.t?'-'+(d.t|0):'');return{name:String(d.lg?d.lg.name:d.name),team:String(d.name),season:d.season,rec,fmt:d.lg?lgCfg(d.lg).tag:'CLASSIC 8 GAMES'}};
/* text -> {ok,items:[{obj,info}]} or {ok:false,msg}; never touches storage */
async function bkUnpack(text){
 try{
  text=String(text==null?'':text);
  const i=text.indexOf(BK_PRE);
  if(i<0)return bkBad(/PPSAVE\d/.test(text)?'THIS BACKUP CODE IS FROM A DIFFERENT VERSION OF THE GAME.':'THAT IS NOT A PIXEL PIGSKIN BACKUP CODE. IT SHOULD START WITH PPSAVE1:');
  const code=text.slice(i).match(/^\S*/)[0],p=code.split(':');
  if(p.length<4||!p[3])return bkBad('THE CODE IS INCOMPLETE. COPY THE WHOLE CODE AND TRY AGAIN.');
  if(p.length>4||(p[1]!=='g'&&p[1]!=='r')||!/^[A-Za-z0-9_-]+$/.test(p[3]))return bkBad('THE CODE IS DAMAGED. COPY IT AGAIN IN FULL.');
  if(bkHash(p[3])!==p[2])return bkBad('THE CODE WAS CUT OFF OR CHANGED, SO IT DOES NOT MATCH ITS CHECKSUM. COPY IT AGAIN IN FULL.');
  let bytes=bkUn64(p[3]);
  if(p[1]==='g'){if(!bkCanZip())return bkBad('THIS BROWSER CANNOT OPEN COMPRESSED CODES. TRY A NEWER BROWSER.');bytes=await bkPipe(bytes,DecompressionStream,'gzip')}
  const obj=JSON.parse(new TextDecoder().decode(bytes));
  const list=obj&&obj.ppBackup==='all'&&Array.isArray(obj.slots)?obj.slots:[obj];
  if(!list.length)return bkBad('THIS BACKUP HAS NO LEAGUES IN IT.');
  const items=[];
  for(let d of list){
   if(!d||typeof d!=='object')return bkBad('THE BACKUP DATA COULD NOT BE READ.');
   if((+d.sv||0)>SAVE_VERSION)return bkBad('THIS BACKUP WAS MADE BY A NEWER VERSION OF THE GAME. UPDATE THE GAME FIRST.');
   d=migrate(d);
   if(!bkShape(d))return bkBad('THIS CODE OPENED, BUT IT IS NOT A COMPLETE LEAGUE (TEAMS, SEASON OR YOUR TEAM IS MISSING).');
   items.push({obj:d,info:bkInfo(d)})}
  return{ok:true,items}
 }catch(e){return bkBad('THE CODE COULD NOT BE READ. IT MAY BE DAMAGED OR CUT OFF. COPY IT AGAIN IN FULL.')}}
/* export: one league slot, or every slot ('all') in one code */
async function exportCode(id,opts){
 opts=opts||{};
 if(id==null||id==='all'){const slots=[];for(const e of rdIdx()){const d=loadSlot(e.id);if(d)slots.push(d)}return bkPack({ppBackup:'all',slots},opts.raw)}
 const d=loadSlot(id);if(!d)throw new Error('NO SUCH LEAGUE');return bkPack(d,opts.raw)}
/* import: always new slots with fresh ids, never overwrites; a repeated name gets " (2)", " (3)" ... */
function bkCommit(items){
 const ids=[],names=[];
 try{
  const taken=new Set(rdIdx().map(e=>e.name));
  for(const it of items){
   const d=JSON.parse(JSON.stringify(it.obj));let id,g=0;
   do{id=newId()}while((lsGet(SLOT+id)||rdIdx().some(e=>e.id===id))&&g++<50);
   let base=String(d.lg?d.lg.name:d.name),n=base,k=2;while(taken.has(n))n=base+' ('+(k++)+')';
   taken.add(n);if(d.lg)d.lg.name=n;else d.name=n;
   d.id=id;
   if(!writeSlot(d))return{ok:false,msg:"COULDN'T SAVE THE LEAGUE (STORAGE MAY BE FULL). NOTHING EXISTING WAS CHANGED.",ids,names};
   ids.push(id);names.push(n)}
  return{ok:true,ids,names}
 }catch(e){return{ok:false,msg:"COULDN'T SAVE THE LEAGUE. NOTHING EXISTING WAS CHANGED.",ids,names}}}
async function importCode(text){
 const r=await bkUnpack(text);if(!r.ok)return r;
 const c=bkCommit(r.items);if(c.ok){try{if(typeof HOME!=='undefined'&&$('menu').classList.contains('on'))renderHome()}catch(e){}}return c}
function bkMark(ids){try{const ix=rdIdx(),now=Date.now();let ch=false;ix.forEach(e=>{if(ids==='all'||ids.includes(e.id)){e.exp=now;ch=true}});if(ch)wrIdx(ix)}catch(e){}}
queueMicrotask(()=>{try{if(window.__pp)Object.assign(window.__pp,{exportCode,importCode,decodeCode:bkUnpack})}catch(e){}});

/* ----- GAME LOG and STATS (v1.84). Every game the player plays by hand adds ONE small record to S.gl (kept inside the league / classic save, so backup codes and

   Not logged: SIM GAME (lgSimMine never reaches endGame), exhibitions, abandoned games (no endGame), a game left with SAVE AND EXIT (logged when finished after RESUME).
   Record fields (indexes):
    0 season  1 week (1.. regular season, -1.. playoff round 1..)  2 opponent (league: team id, classic: name)  3 home (1 home, 0 away, 2 neutral)
    4 my points  5 their points  6 overtime (0/1)  7 difficulty level  8 game speed step (0..4: SLOWER, SLOW, MEDIUM, FAST, FASTER)  9 CALL YOUR DEFENSE on (0/1)
    10 first downs  11 turnovers  12 sacks taken  13 completions  14 attempts  15 pass yards  16 pass TDs  17 interceptions (13..17 = the passer's line)
    18 rush attempts  19 rush yards  20 rush TDs  21 FG made  22 FG tried
    23..26 top rusher: slot, attempts, yards, TDs   27..30 top receiver: slot, catches, yards, TDs
   Slots: 0 QB 1 RB 2 WR1 3 WR2 4 WR3 5 TE 6 K (so a renamed player keeps his stats; screens show the CURRENT names).
   Total yards = pass yards + rush yards, plays = attempts + sacks + rush attempts (both worked out when shown). ----- */

function glSlotName(s){const n=S.names||{};const v=s===0?n.qb:s===1?n.rb:s>=2&&s<=4?(n.wr||[])[s-2]:s===5?n.te:s===6?n.k:'';return v||GL_SLOT[s]||'?'}

   Nothing here is stored in a save: the opponent's hidden tendency comes from a hash of its id (league) or name (classic, exhibition), and the

function dcHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}

function ddZone(c,cx,cy,r){

/* nudge the movable defenders apart so no two shapes overlap (the four linemen and the zone rings stay put) */
function ddSpread(items){for(let it=0;it<200;it++){let moved=false;
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const p=items[i],q=items[j];if(p.fix&&q.fix)continue;let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d>=DD_MIN)continue;moved=true;

function ddArrow(c,x0,y0,x1,y1,t){{const L0=Math.hypot(x1-x0,y1-y0)||1;x0=Math.round(x0+(x1-x0)/L0*6);y0=Math.round(y0+(y1-y0)/L0*6)}

/* the layout of one card: every defender's pixel spot and what is drawn for it. Pure (no drawing, no randomness), so the tests can check it. */
function ddLayout(def){

/* ---------- v2.12 LIVE LINK + LIVE VIEW ----------
   One WebRTC link per game between the two phones, set up in the background while the room is still in the lobby (handshake through Firestore rtclink/{code}: 2 writes, no trickle ICE, STUN only).
   The phone with the ball is still the referee: while it plays a snap it sends the position of the 22 players and the ball about 20 times a second on an unreliable data channel (id 0, one 105-byte frame),
   and SNAP / END as JSON on a reliable one (id 1). The DEFENSE phone draws that stream on the real game screen (show(null), render(), the DOM banner) through a ghost object (LV.g: Object.create of the real G, with its own players);
   the real G of the defense phone is never written. If the link is missing, drops, or goes quiet for 1.5 s, the old still frame is shown (nothing else changes). Nothing here is saved or sent anywhere else.
   Frame (little endian): u8 type=1 | u16 seq | u32 host ms | u16 state counter (OL.snap) | 22 x (int16 x*10, int16 y*10) in the order 5 OL, QB, WR1 WR2 WR3 RB TE, 4 DL, 3 LB, 4 DB | ball int16 x*10, y*10, z*10 | u16 clock*10.
   Defender steering later: add a second frame type in lkRxSt/lkEnc below.
   t2 (v2.22-t2): the link is the fast path for what the players see and do; the room stays the official record and the fallback and nothing waits for it. More messages on 'ev' (JSON, each with the snap counter s):
   PK (the defense's pick), ST (the offense's next state + recap, the same objects it writes to the room), BN (the result banner, with the detail lines the offense shows, and its duration), FX (floating word), SF (sound), PG (ping, every 5 s, replaces the room heartbeat),
   SNAP / END as before. A second frame type (type byte 2) is the PRE-SNAP stream: the same layout, about 4 a second while the offense is lined up (and at once when a defender or the formation moves), 20 a second from the snap (type 1) as before.
   Double apply is prevented by the checks the room path already has (st.s against OL.s, rc.s against OL.rcSeen, the view key OL.vk, OL.snap) plus two new ones: a room copy older than the applied state is ignored (olRoute), and a 'pick' room copy is ignored once I have picked / gone to the field for that state (olView). ---------- */
const LK_BUF=100,LK_N=22,LK_HZ=20,LK_STALE=1500,LK_GIVEUP=25000,LK_HDR=9,LK_LEN=LK_HDR+LK_N*4+6+2,LK_PREHZ=4,LK_PRESTALE=6000,LK_PING=5000; /* t2: pre-snap frames come 4 a second, so the no-frames limit before the snap is 6 s (the live limit stays 1.5 s) */
const LK={code:'',pc:null,st:null,ev:null,unsub:null,ans:0,tm:null,seq:0,acc:0,snapOn:false,was:false,pingAt:0,preAcc:1,preSig:null,mute:0};
const LV={on:false,s:-1,snaps:[],offs:[],g:null,last:0,endT:null,drawnAt:0,holdAt:0,ht:0,deadS:-1,f:null,real:null,pre:false,preF:false,preAt:0,preSince:0,preDead:-1,bn:null,bnEnd:0};
/* --- the frame --- */
function lkEnc(ents,ball,clock,s,ty){
 const b=new ArrayBuffer(LK_LEN),v=new DataView(b);
 v.setUint8(0,ty||1);v.setUint16(1,LK.seq=(LK.seq+1)&0xffff,true);v.setUint32(3,Math.round(performance.now())>>>0,true);v.setUint16(7,s&0xffff,true);
 let o=LK_HDR;for(let i=0;i<LK_N;i++){v.setInt16(o,Math.round(ents[i].x*10),true);v.setInt16(o+2,Math.round(ents[i].y*10),true);o+=4}
 v.setInt16(o,Math.round(ball.x*10),true);v.setInt16(o+2,Math.round(ball.y*10),true);v.setInt16(o+4,Math.round((ball.z||0)*10),true);o+=6;

/* odApply(out,c): out is simOpp's result (out.sub = 'td' | 'fg' | 'fgm' | 'punt' | 'to'); c = {start,edge,k,late,trail,lead,style}. Rewrites out.plays, out.time, out.yd (drive yards) and adds out.log (one string per play) and out.plt (game seconds per play). */

/* ---------- v2.18: SMOOTH SIDE-VIEW FIGURES (the owner's pick from the sprite mock-up) ----------

function dsEdit(){save();DS.prev=null;dsPanel()}
function setRoute(t){const s=curPlay().p[DS.sel];if(s.t!==t){s.t=t;s.d=RTD[t].d}dsEdit()}
function dsDepth(n){const s=curPlay().p[DS.sel];if(s.t==='block')return;s.d=clamp(s.d+n,3,24);dsEdit()}
function dsFlip(){const s=curPlay().p[DS.sel];if(s.t==='block')return;s.f=s.f?0:1;dsEdit()}
function dsAct(b){
 const d=b.dataset,pl=S.plays;
 if(d.s!=null){DS.sel=+d.s;dsPanel()}
 else if(d.t)setRoute(d.t);
 else if(d.a==='back')closeDesigner();
 else if(d.a==='dm')dsDepth(-1);
 else if(d.a==='dp')dsDepth(1);
 else if(d.a==='flip')dsFlip();
 else if(d.a==='new'&&pl.length<MAXP){pl.push(mkPlay('PLAY '+(pl.length+1),['go','go','go','flat','curl']));DS.i=pl.length-1;DS.sel=0;dsEdit()}
 else if(d.a==='copy'&&pl.length<MAXP){const c=JSON.parse(JSON.stringify(curPlay()));c.name=(c.name+' 2').slice(0,14);pl.push(c);DS.i=pl.length-1;dsEdit()}
 else if(d.a==='use'){S.call=DS.i;save();dsPanel()}
 else if(d.a==='del'&&pl.length>1){if(S.call===DS.i)S.call=-1;else if(S.call>DS.i)S.call--;pl.splice(DS.i,1);DS.i=Math.min(DS.i,pl.length-1);DS.sel=0;dsEdit()}
 else if(d.a==='prev'){DS.prev=DS.prev?null:{t:-.4};dsPanel()}}

 curPlay().name=v||'UNNAMED';save();const o=$('pdSel').options[DS.i];if(o)o.textContent=(DS.i+1)+'. '+curPlay().name});

/* ----- input (called from the canvas handlers) ----- */
function dsDown(e){
 const q=pt(e);DS.prev=null;let bi=-1,bd=22;
 curPlay().p.forEach((s,i)=>{const d=Math.hypot(DX(s.x)-q.x,sy(s.y)-8-q.y);if(d<bd){bd=d;bi=i}});
 if(bi<0)return;
 const s=curPlay().p[bi];DS.sel=bi;DS.drag={i:bi,ox:q.x-DX(s.x),oy:q.y-sy(s.y),moved:false};
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 dsPanel()}
function dsMove(e){
 const d=DS.drag;if(!d)return;const q=pt(e),s=curPlay().p[d.i];
 const nx=clamp(Math.round(((q.x-d.ox)/DSC-10)*2)/2,-9,-1),ny=clamp(Math.round(((q.y-d.oy-FT)/UNIT)*2)/2,2,38);
 if((nx!==s.x||ny!==s.y)&&legal(d.i,nx,ny)){s.x=nx;s.y=ny;d.moved=true}}
function dsUp(){if(DS.drag){if(DS.drag.moved)save();DS.drag=null}}
function dsKey(e){
 const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT')return;
 const k=e.key.toLowerCase();
 if(k==='escape')closeDesigner();
 else if(/^[1-9]$/.test(k))setRoute(RT[+k-1].t);
 else if(k==='0')setRoute('hitch');
 else if(k==='b')setRoute('block');
 else if(k==='tab'||k==='n'){DS.sel=(DS.sel+1)%5;dsPanel();e.preventDefault()}
 else if(k==='+'||k==='=')dsDepth(1);
 else if(k==='-')dsDepth(-1);
 else if(k==='f')dsFlip();
 else if(k===' '){DS.prev=DS.prev?null:{t:-.4};dsPanel();e.preventDefault()}}

/* ----- drawing ----- */
function dsPos(s,dist){
 const r=routePath(s,s.x,s.y),P=[{x:s.x,y:s.y},...r.pts];let left=dist,vx=1,vy=0;
 for(let k=1;k<P.length;k++){const a=P[k-1],b=P[k],L=Math.hypot(b.x-a.x,b.y-a.y);if(L<1e-6)continue;
  vx=(b.x-a.x)/L;vy=(b.y-a.y)/L;if(left<=L)return{x:a.x+vx*left,y:a.y+vy*left,m:1,vx};left-=L}
 const e=P[P.length-1];
 if(r.cont&&P.length>1){const x=e.x+vx*left,y=clamp(e.y+vy*left,1.5,38.5);return{x:Math.min(x,25.5),y,m:x<25.5?1:0,vx}}
 return{x:e.x,y:e.y,m:0,vx:1}}
function dsRoute(s,i,alpha,w){
 const r=routePath(s,s.x,s.y),ax=DX(s.x),ay=sy(s.y)-5;
 cx.strokeStyle=cx.fillStyle=RC[i];cx.globalAlpha=alpha;cx.lineWidth=w;cx.lineJoin='round';
 if(!r.pts.length){cx.fillRect(ax+9,ay-7,3,14);cx.fillRect(ax+9,ay-1,6,2);cx.globalAlpha=1;return}
 cx.beginPath();cx.moveTo(ax,ay);let lx=ax,ly=ay,px=ax,py=ay;
 for(const p of r.pts){px=lx;py=ly;lx=DX(p.x);ly=sy(p.y)-5;cx.lineTo(lx,ly)}
 cx.stroke();
 const a=Math.atan2(ly-py,lx-px);
 if(r.cont){cx.beginPath();cx.moveTo(lx+Math.cos(a)*6,ly+Math.sin(a)*6);cx.lineTo(lx+Math.cos(a+2.5)*6,ly+Math.sin(a+2.5)*6);cx.lineTo(lx+Math.cos(a-2.5)*6,ly+Math.sin(a-2.5)*6);cx.fill()}
 else{cx.beginPath();cx.moveTo(lx+Math.cos(a+1.571)*5,ly+Math.sin(a+1.571)*5);cx.lineTo(lx+Math.cos(a-1.571)*5,ly+Math.sin(a-1.571)*5);cx.stroke()}
 cx.globalAlpha=1}
function dsEnt(e,x,y,fr,face){cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(x-5,y-1,11,3);cx.drawImage(getSprite(e,fr,face),x-7,y-19)}
function drawDesigner(){
 const now=performance.now(),dt=Math.min(.05,(now-(DS.ts||now))/1000);DS.ts=now;
 const pl=curPlay(),E=DS.ents;
 cx.fillStyle='#15202f';cx.fillRect(0,0,W,H);
 for(let yd=-10;yd<26;yd+=5){cx.fillStyle=((yd+10)/5)%2?'#2e7d32':'#2a7030';cx.fillRect(DX(yd),FT,Math.min(5*DSC+1,DX(26)-DX(yd)),FB-FT)}
 for(let yd=5;yd<=25;yd+=5){cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(DX(yd),FT,1,FB-FT);txt(''+yd,DX(yd)+2,FT+9,5,'rgba(255,255,255,.55)')}
 cx.fillStyle='rgba(255,255,255,.25)';for(let x=-10;x<26;x++){cx.fillRect(DX(x),sy(14),1,2);cx.fillRect(DX(x),sy(26),1,2)}
 cx.fillStyle='#4aa3ff';cx.fillRect(DX(0)-1,FT,2,FB-FT);txt('LOS',DX(0)+3,FB-5,5,'#9cc8ff');
 cx.fillStyle='#fff';cx.fillRect(0,FT-1,DX(26),2);cx.fillRect(0,FB-1,DX(26),2);
 txt('PLAY DESIGNER',8,22,10,'#ffd400');txt(pl.name,8,42,8,'#fff');
 txt('DRAG A PLAYER TO MOVE HIM. PICK HIS ROUTE AT RIGHT.',8,336,5,'#b8c4dc');txt('PLAYS SAVE AUTOMATICALLY.',8,350,5,'#b8c4dc');
 const pv=DS.prev;
 if(pv){pv.t+=dt;if(pv.t>3.6)pv.t=-.7}
 const items=[];
 items.push({y:20,e:E.qb,x:DX(-5),py:sy(20),fr:0,face:1});
 E.ol.forEach((o,i)=>items.push({y:o.y,e:o,x:DX(-1),py:sy(o.y),fr:0,face:1}));
 pl.p.forEach((s,i)=>{
  if(pv){const q=dsPos(s,Math.max(0,pv.t)*PSPD);items.push({y:q.y,e:E.recs[i],x:DX(q.x),py:sy(q.y),fr:pv.t>0&&q.m?1+Math.floor(pv.t*9+i)%2:0,face:q.vx<-.2?-1:1,i})}
  else items.push({y:s.y,e:E.recs[i],x:DX(s.x),py:sy(s.y),fr:0,face:1,i})});
 for(let i=0;i<4;i++)if(i!==DS.sel)dsRoute(pl.p[i],i,pv?.35:.75,2);
 dsRoute(pl.p[DS.sel],DS.sel,pv?.5:1,3);
 items.sort((a,b)=>a.y-b.y);
 for(const it of items){dsEnt(it.e,Math.round(it.x),Math.round(it.py),it.fr,it.face);
  if(it.i!=null&&!pv){txt(''+(it.i+1),Math.round(it.x),Math.round(it.py)-24,7,RC[it.i],'center');
   if(it.i===DS.sel){cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.strokeRect(Math.round(it.x)-9,Math.round(it.py)-22,19,25)}}}}

/* ---------- play calling ----------
   Before each snap you can open the call sheet (PLAYS button or C) and pick a play from the
   playbook, or RANDOM. S.call is the playbook index of the called play (-1 or missing = random).
   The call sticks from down to down. setRoutes() lines the receivers up and gives them their routes. */
const PC={on:false},DEFA=[[-1,5],[-1,35],[-1.2,28],[-5,15.5],[-1,11]];
function callPlay(){
 if(!Array.isArray(S.plays)||!S.plays.length){S.plays=seedPlays();save()}
 fixPlays();return S.call>=0&&S.call<S.plays.length?S.plays[S.call]:null}
const callName=()=>{const p=callPlay();return p?p.name:'RANDOM'+(G&&G.cpt?': '+G.cpt.name:'')};
function setRoutes(){
 const pl=callPlay()||(G.cpt=pick(NFLC.filter(q=>q.name!=='HAIL MARY'))),l=G.los;if(callPlay())G.cpt=null;
 G.recs.forEach((r,i)=>{
  if(pl){const q=playToRoute(pl,i,l);r.x=r.x0=clamp(q.x,-9.5,108);r.y=r.y0=q.y;r.path=q.path;r.cont=q.cont;r.pi=0;r.route=q.route}
  else{r.x=r.x0=Math.max(-9.5,l+DEFA[i][0]);r.y=r.y0=DEFA[i][1];mkRoute(r,i)}})}

function thumb(c,play){
 const x=c.getContext('2d'),w=c.width,h=c.height,X=v=>(v+9.5)*3,Y=v=>v*h/40;
 x.fillStyle='#2e7d32';x.fillRect(0,0,w,h);x.fillStyle='#2a7030';for(let k=1;k<7;k+=2)x.fillRect(X(-9.5+k*5)+.5,0,15,h);
 if(!play){x.fillStyle='#ffd400';x.font='28px "Press Start 2P",monospace';x.textAlign='center';x.fillText('?',w/2,h/2+10);return}
 x.fillStyle='#4aa3ff';x.fillRect(X(0)-1,0,2,h);
 x.fillStyle=myC().d;for(const y of[14,17,20,23,26])x.fillRect(X(-1)-2,Y(y)-2,5,5);
 x.fillStyle='#f4f4f8';x.fillRect(X(-5)-2,Y(20)-2,5,5);
 play.p.forEach((s,i)=>{
  const r=routePath(s,s.x,s.y);x.strokeStyle=x.fillStyle=RC[i];x.lineWidth=1.6;
  x.fillRect(X(s.x)-2.5,Y(s.y)-2.5,6,6);
  if(!r.pts.length){x.fillRect(X(s.x)+4,Y(s.y)-4,2,8);return}
  x.beginPath();x.moveTo(X(s.x),Y(s.y));let px=X(s.x),py=Y(s.y),lx=px,ly=py;
  for(const p of r.pts){px=lx;py=ly;lx=X(p.x);ly=Y(p.y);x.lineTo(lx,ly)}x.stroke();
  const a=Math.atan2(ly-py,lx-px);
  if(r.cont){x.beginPath();x.moveTo(lx+Math.cos(a)*4,ly+Math.sin(a)*4);x.lineTo(lx+Math.cos(a+2.5)*4,ly+Math.sin(a+2.5)*4);x.lineTo(lx+Math.cos(a-2.5)*4,ly+Math.sin(a-2.5)*4);x.fill()}
  else{x.beginPath();x.moveTo(lx+Math.cos(a+1.571)*3.5,ly+Math.sin(a+1.571)*3.5);x.lineTo(lx+Math.cos(a-1.571)*3.5,ly+Math.sin(a-1.571)*3.5);x.stroke()}})}
function openCalls(){

 const cs=$('pcs').querySelectorAll('canvas');cs.forEach((c,k)=>thumb(c,k?S.plays[k-1]:null));

/* ---------- defenses ----------
   The AI picks one of five schemes at random before every snap (G.def). A scheme gives each of the
   3 linebackers and 4 defensive backs an alignment (al) and an assignment (as):
     as:null     -> rushes the passer (the 4 linemen always rush)
     as:{m:i}    -> man coverage on receiver i (0-2 = WR 1-3, 3 = the RB, 4 = the TE, who is only covered by zones or left open)
     as:{z:[depth,y,halfWidth]} -> drops to a zone `depth` yards past the line, centered at y; a receiver
                    who enters the zone gets covered, otherwise the defender holds the spot
   dbw / lbw = how many seconds after the snap the backs and linebackers hold before closing on a run.
